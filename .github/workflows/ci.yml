name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . check-jsonschema
      - name: build a SARIF report from the synthetic fleet
        run: endpointsweep report testdata/hosts -f sarif -o fleet.sarif --fail-on none
      - name: validate against the vendored SARIF 2.1.0 schema
        run: check-jsonschema --schemafile testdata/schema/sarif-2.1.0.json fleet.sarif

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck collectors
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --shell=sh collectors/endpointsweep_collect.sh
          shellcheck --shell=bash collectors/endpointsweep_collect.bash

  psscriptanalyzer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path collectors/endpointsweep_collect.ps1 -Severity Error,Warning
          $r | Format-Table -AutoSize
          if ($r | Where-Object Severity -eq 'Error') { exit 1 }
