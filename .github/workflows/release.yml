name: release

# Publishes to PyPI via Trusted Publishing (OIDC). There is no API token
# anywhere in this repo or its secrets — GitHub mints a short-lived credential
# for this workflow, and PyPI verifies it came from this repo.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   Owner: harish-ravichandra
#   Repository: endpointsweep
#   Workflow: release.yml
#   Environment: (leave blank)
#
# Release: git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build

      # Never ship a release the suite does not pass.
      - run: ruff check .
      - run: pytest -q

      - name: verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c 'import endpointsweep; print(endpointsweep.__version__)')
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package version $pkg" >&2
            exit 1
          fi

      - run: python -m build
      - run: python -m pip install twine && twine check dist/*

      - name: confirm the collectors are inside the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          need = [
              "endpointsweep/collectors/endpointsweep_collect.sh",
              "endpointsweep/collectors/endpointsweep_collect.bash",
              "endpointsweep/collectors/endpointsweep_collect.ps1",
              "endpointsweep/data/known_packages.json",
          ]
          missing = [n for n in need if n not in names]
          assert not missing, f"missing from wheel: {missing}"
          print("wheel contents OK")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Harden later by adding `environment: pypi` here and on the PyPI
    # publisher config, which gates releases behind an approval.
    permissions:
      id-token: write # required for OIDC; this is the whole credential
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
